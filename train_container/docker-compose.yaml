version: "3"
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    ports:
      - "5000:5000"
    environment:
      MLFLOW_TRACKING_URI: http://0.0.0.0:5000
    command: [
      "mlflow", "server",
      "--host", "0.0.0.0",
      "--port", "5000",
      "--backend-store-uri", "sqlite:///mlflow.db",
      "--default-artifact-root", "/mlflow/artifacts"
    ]
    volumes:
      - ./mlruns:/mlflow/artifacts
