# docker-compose.yaml

services:
  # FastAPI Application Service
  fastapi-app:
    build:
      context: ./minio_container
      dockerfile: Dockerfile
    container_name: fastapi_service
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code  # Mount the app directory for live-reloading during development
    env_file:
      - .env.minio
    depends_on:
      - minio
    networks:
      - app-network


  # MinIO Service
  minio:
    image: minio/minio:latest
    container_name: minio_storage_service
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data # Persist data using a Docker volume
    env_file:
      - .env.minio
    command: server /data --console-address ":9001"
    networks:
      - app-network
  

  # EDA Service
  data_analyzer:
    build: ./eda_container
    ports:
      - "8010:8010"
    environment:
      - GATEWAY_URL=http://fastapi-app:8000
    depends_on:
      - fastapi-app
    networks:
      - app-network


  # Preprocessing Service
  preprocesser:
    build: ./preprocessing_container
    environment:
      - GATEWAY_URL=http://fastapi-app:8000
    depends_on:
      - fastapi-app
    networks:
      - app-network

  # 🔄 Postgres for MLflow Metadata
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    ports:
      - "5432:5432"
    networks:
      - app-network

  # 🔁 MLflow Server
  mlflow:
    build: ./mlflow_container
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://fastapi-app:8000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    depends_on:
      - postgres
      - fastapi-app
    networks:
      - app-network
    command: >
      mlflow server 
      --backend-store-uri postgresql://mlflow:mlflow@postgres/mlflow 
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0 
      --port 5000

  # 🧠 Training Container
  train:
    build: ./train_container
    depends_on:
      - mlflow
    environment:
      - GATEWAY_URL=http://fastapi-app:8000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://fastapi-app:8000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    networks:
      - app-network

  # 🔮 Inference Container
  inference:
    build: 
      context: .
      dockerfile: inference_container/Dockerfile
    depends_on:
      - mlflow
    environment:
      - GATEWAY_URL=http://fastapi-app:8000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://fastapi-app:8000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    networks:
      - app-network

  
  # Evaluation Service
  # evaluator:
  #   build: ./eval_container # Builds the image from the 'client' folder
  #   ports:
  #     - "8030:8030"
  #   environment:
  #     # This is the crucial part: The client connects to the 'gateway' service by its name.
  #     - GATEWAY_URL=http://gateway:8000
  #   depends_on:
  #     - fastapi-app # Waits for the gateway service to be up and running
  #   networks:
  #     - app-network


# Define the network
networks:
  app-network:
    driver: bridge

volumes:
  minio_data:
  # postgres_data:

  
