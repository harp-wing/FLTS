  nonml:
    build: ./nonML_container
    ports:
      - "8022:8022"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - GATEWAY_URL=http://fastapi-app:8000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - CONSUMER_TOPIC=training-data
      - CONSUMER_GROUP_ID=nonml
      - PRODUCER_TOPIC=model-training

      - MODEL_TYPE=AUTOARIMA # (str) Options: PROPHET, AUTOARIMA, AUTOETS, AUTOTHETA, AUTOMFLES, AUTOTBATS
      - DOWNSAMPLING=0 # (str) 0 for original periodicity
      - SEASON_LENGTH=30 # (int) Recommend smallest relevant seasonality

      # - TRIMS=["down"]

    networks:
      - app-network

  # Inference Container (consumer/producer)
  inference:
    build: ./inference_container
    ports:
      - "8023:8023"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - GATEWAY_URL=http://fastapi-app:8000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - TQDM_DISABLE=1 # Disable tqdm progress bars in the logs
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CONSUMER_TOPIC_0=inference-data
      - CONSUMER_TOPIC_1=model-training
      - CONSUMER_GROUP_ID=batch-forecasting
      - PRODUCER_TOPIC=performance-eval

      - SAMPLE_IDX=0 # (int) Index of data point from which to begin inference
      - INFERENCE_LENGTH=4070 # (int) Length of the inference sequence
    networks:
      - common
      - app-network

# Define the network
networks:
  common:
    external: true
  app-network:
    driver: bridge

volumes:
  minio_data:

  
