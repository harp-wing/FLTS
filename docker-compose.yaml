  #     - AWS_SECRET_ACCESS_KEY=minioadmin

  #     - MODEL_TYPE=TCN
  #     - TRAIN_TEST_SPLIT=0.8
  #     - INPUT_SEQ_LEN=10
  #     - OUTPUT_SEQ_LEN=1
      
  #     - HIDDEN_SIZE=128
