# docker-compose.yaml

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
      - "9092:9092" # For communication between containers on the same network
      - "9093:9093" # For communication from the host machine
    environment:
      KAFKA_PROCESS_ROLES: "broker, controller"
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # FastAPI Application Service
  fastapi-app:
    build:
      context: ./minio
      dockerfile: Dockerfile
    container_name: fastapi_service
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code  # Mount the app directory for live-reloading during development
    env_file:
      - .env.minio
    depends_on:
      - minio
    networks:
      - app-network

  # MinIO Service
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data # Persist data using a Docker volume
    env_file:
      - .env.minio
    command: server /data --console-address ":9001"
    networks:
      - app-network
  
  # 🔄 Postgres for MLflow Metadata
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MLflow Server
  mlflow:
    build: ./mlflow
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_TRACKING_URI=http://localhost:5000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    depends_on:
      postgres:
        condition: service_healthy # Waits for the healthcheck to pass
      minio:
        condition: service_started # MinIO starts fast, so 'started' is often enough
    networks:
      - app-network
    command: >
      sh -c "
      echo 'Attempting to create MinIO bucket...' &&
      awslocal --endpoint-url=http://minio:9009 s3 mb s3://mlflow || true &&
      echo 'Bucket check complete. Starting MLflow server...' &&
      mlflow server
      --backend-store-uri postgresql://mlflow:mlflow@postgres/mlflow
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0
      --port 5000
      "

  # EDA Service
  # eda:
  #   build: ./eda_container
  #   ports:
  #     - "8010:8010"
  #   environment:
  #     - GATEWAY_URL=http://fastapi-app:8000
  #   depends_on:
  #     - fastapi-app
  #   networks:
  #     - app-network


  # Preprocessing Service (Producer)
  preprocess:
    build: ./preprocess_container
    ports:
      - "8020:8020"
    environment:
      - GATEWAY_URL=http://fastapi-app:8000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PRODUCER_TOPIC_0=training-data
      - PRODUCER_TOPIC_1=inference-data

      - SCALER=StandardScaler
    depends_on:
      fastapi-app:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - common
      - app-network
    
