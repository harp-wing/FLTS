# docker-compose.yaml

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
      - "9092:9092" # For communication between containers on the same network
      - "9093:9093" # For communication from the host machine
    environment:
      KAFKA_PROCESS_ROLES: "broker, controller"
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # FastAPI Application Service
  fastapi-app:
    build:
      context: ./minio_container
      dockerfile: Dockerfile
    container_name: fastapi_service
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code  # Mount the app directory for live-reloading during development
    env_file:
      - .env.minio
    depends_on:
      - minio
    networks:
      - app-network

  # MinIO Service
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data # Persist data using a Docker volume
    env_file:
      - .env.minio
    command: server /data --console-address ":9001"
    networks:
      - app-network
  
  # 🔄 Postgres for MLflow Metadata
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MLflow Server
  mlflow:
    build: ./mlflow_container
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9009
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    depends_on:
      postgres:
        condition: service_healthy # Waits for the healthcheck to pass
      minio:
        condition: service_started # MinIO starts fast, so 'started' is often enough
    networks:
      - app-network
    command: >
      sh -c "
      echo 'Attempting to create MinIO bucket...' &&
      awslocal --endpoint-url=http://minio:9009 s3 mb s3://mlflow || true &&
      echo 'Bucket check complete. Starting MLflow server...' &&
      mlflow server
      --backend-store-uri postgresql://mlflow:mlflow@postgres/mlflow
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0
      --port 5000
      "

  # EDA Service
  eda:
    build: ./eda_container
    ports:
      - "8010:8010"
    environment:
      - GATEWAY_URL=http://fastapi-app:8000
    depends_on:
      - fastapi-app
    networks:
      - app-network


  # Preprocessing Service (Producer)
  preprocess:
    build: ./preprocess_container
    ports:
      - "8020:8020"
    environment:
      - GATEWAY_URL=http://fastapi-app:8000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PRODUCER_TOPIC_0=training-data
      - PRODUCER_TOPIC_1=inference-data
    depends_on:
      fastapi-app:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - app-network
    
  # Training Container (consumer/producer)
  train:
    build: ./train_container
    ports:
      - "8021:8021"
    depends_on:
      mlflow:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      - GATEWAY_URL=http://fastapi-app:8000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CONSUMER_TOPIC=training-data
      - CONSUMER_GROUP_ID=train # should be changed according to an input argument on container creation
      - PRODUCER_TOPIC=model-training
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin

      - MODEL_TYPE=TETS
      - TRAIN_TEST_SPLIT=0.8
      - INPUT_SEQ_LEN=10
      - OUTPUT_SEQ_LEN=1
      
      - HIDDEN_SIZE=128
      - NUM_LAYERS=4
      - MODEL_DIM=128
      - NUM_HEADS=8
      - FEEDFORWARD_DIM=512
      - DROPOUT=0.1
      - LAYER_ARCHITECTURE=[32, 64, 128, 256]
      - KERNEL_SIZE=2

      - BATCH_SIZE=32
      - EPOCHS=50
      - EARLY_STOPPING=True
      - PATIENCE=30
      - LEARNING_RATE=0.001

    networks:
      - app-network

  # nonml:
  #   build: ./nonML_container
  #   ports:
  #     - "8022:8022"
  #   depends_on:
  #     kafka:
  #       condition: service_healthy
  #   environment:
  #     - GATEWAY_URL=http://fastapi-app:8000
  #     - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
  #     - MLFLOW_TRACKING_URI=http://mlflow:5000
  #     - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
  #     - CONSUMER_TOPIC=training-data
  #     - CONSUMER_GROUP_ID=nonml
  #     - PRODUCER_TOPIC=model-training

  #     - DOWNSAMPLING=0 # 0 for original periodicity
  #     - SEASON_LENGTH=1D # Recommend smallest relevant seasonality

  #   networks:
  #     - app-network

  # Inference Container (consumer/producer)
  inference:
    build: ./inference_container
    ports:
      - "8023:8023"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - GATEWAY_URL=http://fastapi-app:8000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CONSUMER_TOPIC_0=inference-data
      - CONSUMER_TOPIC_1=model-training
      - CONSUMER_GROUP_ID=batch-forecasting
      - PRODUCER_TOPIC=performance-eval
    networks:
      - app-network

  
  # Evaluation Service
  eval:
    build: ./eval_container
    ports:
      - "8030:8030"
    environment:
      - GATEWAY_URL=http://fastapi-app:8000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CONSUMER_TOPIC_0=inference-data
      - CONSUMER_TOPIC_1=performance-eval
      - CONSUMER_GROUP_ID=evaluator
      - PRODUCER_TOPIC=eval-output
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - app-network
  

  # Postgres for Superset Metadata
  superset-postgres:
    image: postgres:13
    container_name: superset_postgres
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset
    command: >
      sh -c "
      psql -U superset -c 'CREATE DATABASE hive_metastore;' || true &&
      docker-entrypoint.sh postgres
      "
    ports:
      - "5433:5432"
    volumes:
      - superset_postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Hive Metastore for Trino
  hive-metastore:
    build: ./hive
    container_name: hive-metastore
    environment:
      - SERVICE_NAME=metastore
      - HIVE_METASTORE_HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - HIVE_METASTORE_WAREHOUSE_DIR=s3a://warehouse/
    volumes:
      - ./hive/conf/hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./hadoop/conf:/opt/hadoop/etc/hadoop
    ports:
      - "9083:9083"
    networks:
      - app-network
    depends_on:
      superset-postgres:
        condition: service_healthy

  # Trino Coordinator
  trino: # SQLAlchemy URI: trino://admin@trino:8080/minio
    image: trinodb/trino:463
    container_name: trino_coordinator
    ports:
      - "8080:8080"
    environment:
      - TRINO_CATALOGS_DIR=/trino/etc/catalog
    volumes:
      - ./trino/etc:/etc/trino:ro
      - ./hadoop/conf/core-site.xml:/etc/hadoop/conf/core-site.xml:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      - minio
      - hive-metastore

  # Redis for Superset caching
  redis:
    image: redis:7-alpine
    container_name: superset_redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache Superset
  superset:
    build: .\superset
    container_name: apache_superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=your-secret-key-here-change-this
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://superset:superset@superset-postgres:5432/superset
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - superset_home:/app/superset_home
      - ./superset/superset_config.py:/app/superset_config.py:ro
    networks:
      - app-network
    depends_on:
      superset-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      trino:
        condition: service_healthy
    command: >
      sh -c "
      superset fab create-admin --username admin --firstname Admin --lastname User --email admin@superset.com --password admin &&
      superset db upgrade &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088 --with-threads --reload --debugger
      "


# Define the network
networks:
  app-network:
    driver: bridge

volumes:
  minio_data:
  superset_postgres_data:
  superset_home:

  
